[package]
name = "to_and_fro"
version = "0.7.1"
edition = "2021"
description = "Proc macro for generating implimentations of Display and FromStr for Enum Variants"
repository = "https://github.com/tascord/ToAndFro"
homepage = "https://github.com/tascord/ToAndFro"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
proc-macro = true

[dependencies]
anyhow = "1.0.102"
heck = "0.5.0"
proc-macro2 = "1.0.106"
quote = "1.0.45"
syn = { version = "2.0.117", features = ["full", "fold"] }
percent-encoding = "2.3.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
